[project]
name = "spec-check"
version = "0.1.0"
description = "spec check — mechanizes specs/checking.md for the cat-spec self-hosted spec system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
spec-check = "spec_check.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
